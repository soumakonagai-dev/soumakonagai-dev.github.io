<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="origin">
<meta name="robots" content="noindex">
<title>SOBINSON'S LAB に引っ越しました</title>
<link rel="canonical" href="https://sobinsonslab.com/">
<noscript><meta http-equiv="refresh" content="0;url=https://sobinsonslab.com/"></noscript>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8ecff;font:16px/1.7 sans-serif;text-align:center;padding:16px;box-sizing:border-box}a{color:#ffe27a}</style>
</head>
<body>
<p>このサイトは SOBINSON'S LAB として新しいURLに引っ越しました。<br>セーブデータを引き継いで移動しています…<br><a id="go" href="https://sobinsonslab.com/">https://sobinsonslab.com/</a></p>
<script>
// 旧URL（soumakonagai-dev.github.io）に置く引っ越しページ。index.html と 404.html の両方がこれなので、
// どのページを開いても動く。この端末の localStorage（各ゲームのセーブ）をまとめて、
// 新しいURLの move.html に #d= で渡し、同じパスへ移動する。# 以降はサーバーに送られない。
(async function () {
  var url = 'https://sobinsonslab.com/move.html#to=' + encodeURIComponent(location.pathname + location.search);
  try {
    var data = {};
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); data[k] = localStorage.getItem(k); }
    if (Object.keys(data).length) {
      var bytes = new TextEncoder().encode(JSON.stringify(data)), z = 0;
      if (window.CompressionStream) {
        bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
        z = 1;
      }
      var bin = '';
      for (var j = 0; j < bytes.length; j += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000));
      url += '&z=' + z + '&d=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch (e) {}
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
