<style>html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}input,select,textarea{font-size:max(16px,1em)}</style><script>(function(){var l=0,o={passive:false,capture:true},m=document.querySelector('meta[name="viewport"]'),c=m&&m.content;document.addEventListener("touchstart",function(e){if(e.touches.length>1&&e.cancelable)e.preventDefault();},o);document.addEventListener("touchend",function(e){var n=Date.now();if(n-l<350&&e.cancelable)e.preventDefault();l=n;},o);["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},o);});document.addEventListener("dblclick",function(e){e.preventDefault();},o);var v=window.visualViewport;if(v&&m)v.addEventListener("resize",function(){if(v.scale>1.01){m.content=c+",maximum-scale=1.0001";setTimeout(function(){m.content=c;},60);}});})();</script>

<title>カゲヌケ</title>
<style>
  html,body{margin:0;height:100%;background:#120d1f;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));background:#2b2142;touch-action:none}
  @supports (height:100dvh){canvas{width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16))}}
  #rot{display:none;position:fixed;inset:0;z-index:10;background:#120d1f;color:#f5e6c4;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px}
  #rot b{font-size:28px}
  #rot i{font-style:normal;font-size:64px;display:block;animation:tilt 2s ease-in-out infinite}
  @keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
