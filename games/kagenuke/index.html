<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120d1f">
<title>カゲヌケ</title>
<style>
  html,body{margin:0;height:100%;background:#120d1f;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));background:#2b2142;touch-action:none}
  @supports (height:100dvh){canvas{width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16))}}
  #rot{display:none;position:fixed;inset:0;z-index:10;background:#120d1f;color:#f5e6c4;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px}
  #rot b{font-size:28px}
  #rot i{font-style:normal;font-size:64px;display:block;animation:tilt 2s ease-in-out infinite}
  @keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1600" height="900"></canvas></div>
<div id="rot"><i>📱</i><b>スマホを よこむきに してね</b><span>よこむきで あそぶゲームです</span></div>
<script>addEventListener('contextmenu', function (e) { e.preventDefault(); });</script>
<script src="js/core.js?v=28cf9157"></script>
<script src="js/art.js?v=28cf9157"></script>
<script src="js/stages.js?v=28cf9157"></script>
<script src="js/game.js?v=28cf9157"></script>
</body>
</html>
