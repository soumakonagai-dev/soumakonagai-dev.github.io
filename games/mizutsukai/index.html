<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ミズツカイ</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:none;touch-action:none}
  .jp{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  /* スマホ用ボタン（タッチ操作のときだけ表示。ゲーム画面の左右の余白に置く） */
  .tc{position:fixed;display:none;touch-action:none;color:#fff;font-weight:bold;box-sizing:border-box}
  body.touch .tc{display:flex}
  #pad{left:calc(env(safe-area-inset-left) + 8px);bottom:16px;width:var(--pad);height:var(--pad);border-radius:50%;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);align-items:center;justify-content:center}
  #pad span{position:absolute;font-size:calc(var(--pad) * .17);opacity:.6;pointer-events:none}
  #pad .u{top:6%}#pad .d{bottom:6%}#pad .l{left:8%}#pad .r{right:8%}
  #pad span.on{opacity:1;color:#7fd4ff}
  #knob{position:absolute;width:38%;height:38%;border-radius:50%;background:rgba(127,212,255,.35);pointer-events:none;
    left:31%;top:31%}
  #jump{right:calc(env(safe-area-inset-right) + 12px);bottom:28px;width:calc(var(--pad) * .72);height:calc(var(--pad) * .72);
    border-radius:50%;background:rgba(127,212,255,.18);border:2px solid rgba(127,212,255,.6);
    align-items:center;justify-content:center;font-size:14px}
  #jump.on{background:rgba(127,212,255,.45)}
  .sm{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);
    align-items:center;justify-content:center;font-size:20px;top:calc(env(safe-area-inset-top) + 10px)}
  #bmenu{right:calc(env(safe-area-inset-right) + 10px)}
  #bretry{right:calc(env(safe-area-inset-right) + 62px)}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:#0b1020;color:#cfe8ff;font-size:20px;z-index:10;text-align:center;gap:12px}
  body.touch.portrait #rotate{display:flex}
</style>
</head>
<body class="jp">
<div id="wrap"><canvas id="game" width="640" height="352"></canvas></div>
<div id="pad" class="tc"><div id="knob"></div><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div>
<div id="jump" class="tc">ジャンプ</div>
<div id="bretry" class="tc sm">↺</div>
<div id="bmenu" class="tc sm">≡</div>
<div id="rotate"><div style="font-size:48px">📱↻</div>スマホを横向きにしてね</div>
<script src="js/levels.js?v=569b00ef"></script>
<script src="js/game.js?v=569b00ef"></script>
</body>
</html>
