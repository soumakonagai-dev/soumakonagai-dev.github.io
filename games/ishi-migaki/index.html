<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>いしみがき（デモ版）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc4ee;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:110px;display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;pointer-events:none;font-weight:700;font-size:14px}
#hud span{background:#000a;padding:5px 10px;border-radius:14px;white-space:nowrap}
#gold{color:#ffd84a}
#menubtn{position:fixed;top:8px;right:10px;z-index:5;border:0;border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px;background:#e8a93a;color:#2a1a00;cursor:pointer}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cross:before{left:8px;top:0;width:2px;height:18px;opacity:.8}
#cross:after{top:8px;left:0;height:2px;width:18px;opacity:.8}
body:not(.touch) #cross{display:none}
#prompt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000b;padding:7px 16px;border-radius:14px;font-size:15px;font-weight:700;display:none;pointer-events:none}
#polinfo{position:fixed;left:10px;bottom:10px;width:240px;background:#10151fdd;border-radius:12px;padding:10px;font-size:13px;display:none;pointer-events:none}
#polinfo .bar{height:10px;background:#0006;border-radius:5px;overflow:hidden;margin:3px 0 6px}
#polinfo .bar i{display:block;height:100%;width:0}
#help{position:fixed;right:10px;bottom:10px;font-size:12px;text-align:right;opacity:.9;text-shadow:0 1px 3px #000;pointer-events:none;line-height:1.6}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;z-index:8;cursor:pointer;text-align:center;line-height:1.9}
#start h1{margin:0 0 10px;font-size:32px}
#start p{margin:0;font-size:15px}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;z-index:9}
#mbox{width:min(580px,96vw);max-height:90vh;display:flex;flex-direction:column;background:#10151ff2;border-radius:16px;padding:12px;font-size:14px}
#mtabs{display:flex;gap:5px;margin-bottom:8px}
#mtabs button{flex:1;padding:9px 2px;border:0;border-radius:10px;background:#35405a;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
#mtabs button.on{background:#e8a93a;color:#2a1a00}
#mbody{overflow:auto;flex:1;min-height:200px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #fff2}
.row small{display:block;opacity:.75;font-size:12px}
.row .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button.b{border:0;border-radius:10px;padding:7px 11px;background:#3aa86a;color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
button.b:disabled{background:#4a4f5c;color:#999;cursor:default}
button.b.sub{background:#4a64a8}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pop{position:fixed;pointer-events:none;font-weight:900;font-size:22px;text-shadow:0 2px 4px #000;animation:fl 1.1s ease-out forwards;transform:translate(-50%,-50%);z-index:7}
@keyframes fl{to{transform:translate(-50%,-150px);opacity:0}}
#msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:9px 18px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7;text-align:center}
#touch{display:none}
body.touch #touch{display:block}
#joy{position:fixed;left:18px;bottom:28px;width:120px;height:120px;border-radius:50%;background:#fff3;border:2px solid #fff6;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fffa}
.tb{position:fixed;border-radius:50%;border:2px solid #fff8;background:#e8a93acc;color:#2a1a00;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none}
#btnAct{right:20px;bottom:40px;width:96px;height:96px;font-size:16px}
#btnJump{right:128px;bottom:28px;width:62px;height:62px;font-size:13px;background:#6aa8e8cc}
body.touch #help{display:none}
body.touch #polinfo{bottom:160px}
</style>

<div id="start"><h1>いしみがき</h1><p>クリックで開始<br>穴を下へ掘って石を見つけ、洗って磨いて売ろう<br>↑↓ 前後に移動　←→ 向き変更　マウスを端に寄せても向き変更　左ボタン長押しで作業</p></div>
<div id="menu"><div id="mbox"><div id="mtabs"></div><div id="mbody"></div><div class="row"><span></span><button class="b sub" onclick="G.close()">閉じる (Esc)</button></div></div></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><div class="tb" id="btnAct">掘る/磨く</div><div class="tb" id="btnJump">ジャンプ</div></div>

<script>
(function(){
'use strict';
// ===== データ =====
// fx: 0=ふつう 1=遊色(オパール) 2=光で色が変わる 3=二色(トルマリン) 4=ファイア(ダイヤ)
// avg=平均の重さ(kg) price=平均の重さで完ぺきに磨く前の基本価格 w=その層での出やすさ
var STONES=[
 {n:'小石',layer:1,price:2,avg:.8,w:50,col:'#8d8d8d'},
 {n:'川石',layer:1,price:4,avg:.6,w:30,col:'#e8e2d4'},
 {n:'黄鉄鉱',layer:1,price:14,avg:.5,w:14,col:'#d4b030',metal:.85},
 {n:'琥珀',layer:1,price:60,avg:.15,w:6,col:'#e89a18',gem:1},
 {n:'赤めのう',layer:2,price:15,avg:1,w:45,col:'#d2552e'},
 {n:'石英',layer:2,price:20,avg:1.2,w:30,col:'#eef0ff',gem:1},
 {n:'柘榴石',layer:2,price:70,avg:.4,w:17,col:'#9a1a30',gem:1},
 {n:'オパール',layer:2,price:220,avg:.3,w:8,col:'#e8f0ff',gem:1,fx:1,amt:.6},
 {n:'翡翠',layer:3,price:80,avg:.9,w:40,col:'#1f9a62'},
 {n:'紫水晶',layer:3,price:120,avg:1,w:30,col:'#9b4fd6',gem:1},
 {n:'ラピスラズリ',layer:3,price:200,avg:.7,w:20,col:'#1c3a9a'},
 {n:'トルマリン',layer:3,price:450,avg:.4,w:10,col:'#e04a80',gem:1,fx:3,cA:[.92,.25,.5],cB:[.1,.68,.38]},
 {n:'サファイア',layer:4,price:500,avg:.3,w:36,col:'#2457e6',gem:1},
 {n:'ルビー',layer:4,price:650,avg:.3,w:30,col:'#d8143c',gem:1},
 {n:'エメラルド',layer:4,price:1000,avg:.25,w:24,col:'#0aa05a',gem:1},
 {n:'アレキサンドライト',layer:4,price:3500,avg:.15,w:10,col:'#20a070',gem:1,fx:2,cA:[.05,.62,.4],cB:[.7,.1,.32]},
 {n:'ダイヤモンド',layer:5,price:3000,avg:.2,w:50,col:'#e6f6ff',gem:1,fx:4},
 {n:'星の石',layer:5,price:8000,avg:.3,w:25,col:'#ffd84a',gem:1,glow:[1,.7,.15]},
 {n:'ブラックオパール',layer:5,price:15000,avg:.2,w:18,col:'#14181e',gem:1,fx:1,amt:.95},
 {n:'賢者の石',layer:5,price:40000,avg:.1,w:7,col:'#d0302a',gem:1,fx:2,cA:[.85,.1,.12],cB:[1,.78,.2],glow:[1,.3,.1]}];
var LAYERS=[
 {n:'表土',hp:3,col:'#8a6a48'},{n:'赤土',hp:10,col:'#a8553a'},
 {n:'岩盤',hp:30,col:'#6a6e7a'},{n:'深層',hp:80,col:'#403f66'},
 {n:'マグマ層',hp:200,col:'#6a2a1c'}];
var PICKS=[
 {n:'木のつるはし',cost:0,layer:1,pow:1,col:0x9a6a3a},{n:'石のつるはし',cost:100,layer:2,pow:3,col:0x9a9a9a},
 {n:'鉄のつるはし',cost:800,layer:3,pow:8,col:0xd0d4da},{n:'金のつるはし',cost:6000,layer:4,pow:20,col:0xffc83a},
 {n:'ダイヤのつるはし',cost:40000,layer:5,pow:50,col:0x7fe8ff}];
var SHINE_PTS=[[0,1],[25,1.5],[50,2.5],[75,4],[100,6]];
var SAVE='ishimigaki_demo_v3';
var UNLOCK_EARNED=300;
var NV=162; // 石の頂点数
var LST=[[],[],[],[],[]];STONES.forEach(function(s,i){LST[s.layer-1].push(i);});

// ===== 状態 =====
var S={gold:0,earned:0,pick:0,cloth:0,bag:0,stones:[],bench:0,codex:{},nid:1,mined:[],reqs:[],reqOn:false,rid:1,best:0};
try{var o=JSON.parse(localStorage.getItem(SAVE));if(o)for(var k in o)S[k]=o[k];}catch(e){}
S.stones.forEach(function(s){if(!s.d)s.d=new Array(s.p.length).fill(s.p.some(function(v){return v>0;})?0:1);});
function save(){try{
 var c={};for(var k in S)c[k]=S[k];
 c.stones=S.stones.map(function(s){return {id:s.id,t:s.t,w:s.w,seed:s.seed,done:s.done,d:s.d.map(function(v){return Math.round(v*100)/100;}),p:s.p.map(function(v){return Math.round(v*100)/100;})};});
 localStorage.setItem(SAVE,JSON.stringify(c));}catch(e){}}
function cap(){return 10+5*S.bag;}
function mult(sh){for(var i=1;i<SHINE_PTS.length;i++){var a=SHINE_PTS[i-1],b=SHINE_PTS[i];if(sh<=b[0])return a[1]+(b[1]-a[1])*(sh-a[0])/(b[0]-a[0]);}return 6;}
function stats(st){
 if(st._s)return st._s;var a=0,o=0,n=st.p.length;
 var dd=0;for(var i=0;i<n;i++){a+=Math.min(1,st.p[i]);o+=Math.max(0,st.p[i]-1);dd+=st.d[i];}
 return (st._s={avg:a/n,over:o/n,dirt:dd/n});}
function ratio(st){return st.w/STONES[st.t].avg;} // 平均の重さとの比＝重さの倍率
function value(st){var s=stats(st),d=STONES[st.t];
 return Math.max(1,Math.round(d.price*ratio(st)*mult(s.avg*100)*Math.max(.15,1-3*s.over)));}
function canSell(st){return stats(st).dirt<=.5;} // 汚れが半分以下まで落ちていないと売れない
function fmt(n){return n.toLocaleString('ja-JP');}
function kg(st){return st.w.toFixed(2)+'kg';}
function sname(s){return STONES[s.t].n+' '+kg(s);}
function gauss(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());}
function randW(t){var a=STONES[t].avg;return Math.round(a*Math.min(3.2,Math.max(.35,Math.exp(gauss()*.4)))*100)/100;}
function benchStone(){for(var i=0;i<S.stones.length;i++)if(S.stones[i].id===S.bench)return S.stones[i];return null;}

// ===== 音 =====
var AC=null,lastSnd=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,to){var c=ac();if(!c)return;var t=c.currentTime,o=c.createOscillator(),g=c.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);}
var snd={
 hit:function(){tone(180,.12,'square',.14,60);},
 brk:function(){tone(120,.25,'sawtooth',.16,40);tone(500,.1,'square',.06,200);},
 clang:function(){tone(900,.15,'triangle',.12,700);},
 shine:function(){var n=performance.now();if(n-lastSnd<80)return;lastSnd=n;tone(1800+Math.random()*600,.06,'triangle',.04);},
 over:function(){var n=performance.now();if(n-lastSnd<120)return;lastSnd=n;tone(220,.1,'sawtooth',.06,150);},
 perfect:function(){[880,1320,1760,2640].forEach(function(f,i){setTimeout(function(){tone(f,.4,'sine',.12);},i*70);});},
 coin:function(){tone(1200,.08,'square',.1);setTimeout(function(){tone(1700,.18,'square',.1);},70);},
 buy:function(){tone(500,.1,'triangle',.15);setTimeout(function(){tone(750,.2,'triangle',.15);},90);},
 req:function(){tone(660,.15,'sine',.12);setTimeout(function(){tone(990,.3,'sine',.12);},140);},
 step:function(){tone(70+Math.random()*30,.06,'triangle',.07,40);},
 wash:function(){var n=performance.now();if(n-lastSnd<70)return;lastSnd=n;tone(500+Math.random()*400,.05,'sawtooth',.03,300);}
};

// ===== 3D 基本 =====
var HORIZ=new THREE.Color(0xbcd6ee),TOPC=new THREE.Color(0x5b94d8),DARK=new THREE.Color(0x030409);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement,document.body.firstChild);
var cv=renderer.domElement;
var scene=new THREE.Scene();scene.background=HORIZ.clone();scene.fog=new THREE.Fog(0xbcd6ee,35,120);
var camera=new THREE.PerspectiveCamera(70,1,.05,300);camera.rotation.order='YXZ';scene.add(camera);

(function(){ // 反射用の環境マップ（色つきの光源を並べた部屋）
 var es=new THREE.Scene();
 es.add(new THREE.Mesh(new THREE.BoxGeometry(40,40,40),new THREE.MeshBasicMaterial({color:0x5a6070,side:THREE.BackSide})));
 function pan(c,x,y,z,w,h,d){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);es.add(m);}
 pan(0xffffff,0,18,0,14,1,14);pan(0xfff0dd,-17,6,0,1,10,14);pan(0xdde8ff,17,6,6,1,6,10);pan(0xffffff,0,5,-17,16,6,1);
 pan(0xffb060,10,2,15,6,6,1);pan(0xff5a6a,-12,3,14,3,8,1);pan(0x5aa0ff,-6,9,-16,4,3,1);pan(0x7aff9a,14,10,-8,1,3,4);
 var pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es).texture;pm.dispose();
})();

var hemi=new THREE.HemisphereLight(0xcfe0ff,0x665544,.4);scene.add(hemi);
var sun=new THREE.DirectionalLight(0xfff2dc,1.15);sun.position.set(30,50,20);scene.add(sun);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
(function(){var c=sun.shadow.camera;c.left=-34;c.right=34;c.top=34;c.bottom=-34;c.near=1;c.far=150;c.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;})();
var lamp=new THREE.PointLight(0xffd9a0,.9,14);camera.add(lamp);
// 空
var skyM=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:TOPC.clone()},bot:{value:HORIZ.clone()}},
 vertexShader:'varying float vH;void main(){vH=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float vH;void main(){gl_FragColor=vec4(mix(bot,top,pow(clamp(vH,0.,1.),.55)),1.);}'});
var sky=new THREE.Mesh(new THREE.SphereGeometry(200,24,12),skyM);sky.frustumCulled=false;sky.renderOrder=-1;scene.add(sky);

function mat(c,r){return new THREE.MeshStandardMaterial({color:c,roughness:r==null?.9:r,metalness:0,envMapIntensity:.2});}
function box(w,h,d,x,y,z,m,parent){var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;(parent||scene).add(b);return b;}
function label(text,x,y,z,w,parent){
 var c=document.createElement('canvas');c.width=512;c.height=128;var g=c.getContext('2d');
 g.fillStyle='#3b2a18';g.fillRect(0,0,512,128);g.strokeStyle='#c99a52';g.lineWidth=8;g.strokeRect(6,6,500,116);
 g.fillStyle='#ffe2a8';g.font='bold 56px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,68);
 var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
 var m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:t}));m.position.set(x,y,z);(parent||scene).add(m);return m;}

// ===== テクスチャ（つなぎ目のないノイズ） =====
function hash(x,y,s){var n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n);}
function pnoise(x,y,per,s){
 var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 function w(a){return ((a%per)+per)%per;}
 var a=hash(w(xi),w(yi),s),b=hash(w(xi+1),w(yi),s),c=hash(w(xi),w(yi+1),s),d=hash(w(xi+1),w(yi+1),s);
 return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(u,v,s){var t=0,a=.5,p=4;for(var o=0;o<5;o++){t+=a*pnoise(u*p,v*p,p,s+o);a*=.5;p*=2;}return t;}
function makeTex(size,lo,hi,seed,tint,edge,rep){
 var c=document.createElement('canvas');c.width=c.height=size;var g=c.getContext('2d'),im=g.createImageData(size,size);
 for(var y=0;y<size;y++)for(var x=0;x<size;x++){
  var v=fbm(x/size,y/size,seed),k=lo+(hi-lo)*Math.min(1,Math.max(0,(v-.2)*1.6)),
      pit=pnoise(x/size*24,y/size*24,24,seed+9)<.2?.78:1,i=(y*size+x)*4;
  if(edge){var e=Math.min(x,y,size-1-x,size-1-y);if(e<2)k*=.62+e*.15;}
  im.data[i]=Math.min(255,k*tint[0]*pit);im.data[i+1]=Math.min(255,k*tint[1]*pit);im.data[i+2]=Math.min(255,k*tint[2]*pit);im.data[i+3]=255;}
 g.putImageData(im,0,0);
 var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
 if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
 return t;}

// ===== 世界 =====
var PW=13,PD=30,X0=-6.5,Z0=-22.5,LD=6; // 穴の幅・深さ・左上、1層の厚さ
var rockTex=makeTex(128,120,255,3,[1,1,1],true,false);
var grassTex=makeTex(128,110,255,8,[.42,.62,.3],false,true);
var groundM=new THREE.MeshStandardMaterial({color:0xffffff,map:grassTex,bumpMap:grassTex,bumpScale:.6,roughness:1,envMapIntensity:.1});
var rockM=new THREE.MeshStandardMaterial({color:0x6a6460,map:rockTex,bumpMap:rockTex,bumpScale:.8,roughness:1,envMapIntensity:.1});
function groundBox(w,d,x,z){
 var g=new THREE.BoxGeometry(w,1,d),uv=g.attributes.uv;
 for(var i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*w/5,uv.getY(i)*d/5);
 var m=new THREE.Mesh(g,groundM);m.position.set(x,-.5,z);m.receiveShadow=true;scene.add(m);}
// 地面（穴の部分をくりぬく）
groundBox(53.5,120,-33.25,0);groundBox(53.5,120,33.25,0);groundBox(13,69.5,0,25.25);groundBox(13,37.5,0,-41.25);
// 穴の壁と底
box(1,30,15,-7,-16,-16,rockM);box(1,30,15,7,-16,-16,rockM);box(13,30,1,0,-16,-9,rockM);box(13,30,1,0,-16,-23,rockM);
box(15,1,15,0,-30.5,-16,mat(0x1c1c20));

function buildStone(seed,gem){

  if(map[key]===undefined){
   map[key]=u.length;
   var lump=1+.24*Math.sin(x*2.3+a)*Math.cos(y*2.1+b)+.16*Math.sin(z*3+c);
   var f=(gem?.86+r()*.3:.68+r()*.55)*lump;

  if(benchMesh)scene.remove(benchMesh);

  benchMesh=makeStoneMesh(st);benchMesh.scale.setScalar(sc);
  benchMesh.position.set(BENCH.x,1.03+.6*sc*1.4,BENCH.z);scene.add(benchMesh);benchId=st.id;}
}
var lastWarn=0;
function nearDirt(local,R){var st=benchStone(),u=benchMesh.userData.u,t=0,n=0;
 for(var k=0;k<u.length;k++){var dx=u[k].x-local.x,dy=u[k].y-local.y,dz=u[k].z-local.z;if(Math.sqrt(dx*dx+dy*dy+dz*dz)<R){t+=st.d[k];n++;}}
 return n?t/n:0;}
function washAt(local,amt,wp){
 var st=benchStone();if(!st||!benchMesh)return;
 var u=benchMesh.userData.u,R=.7,ch=false;
 for(var k=0;k<u.length;k++){
  var dx=u[k].x-local.x,dy=u[k].y-local.y,dz=u[k].z-local.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(d<R&&st.d[k]>0){st.d[k]=Math.max(0,st.d[k]-amt*(.5+.5*(1-d/R)));ch=true;}}
 if(!ch)return;
 st._s=null;shapeStone(benchMesh,st);snd.wash();burst(wp,0x7fc8ff,2,2);
 if(!st.washed&&stats(st).dirt<.02){st.washed=true;toast('きれいに洗えた！ 次は磨こう');}
}
function polishAt(local,amt){
 var st=benchStone();if(!st||!benchMesh)return;
 var u=benchMesh.userData.u,R=.6,ch=false,ov=false,blocked=false;
 for(var k=0;k<u.length;k++){
  var dx=u[k].x-local.x,dy=u[k].y-local.y,dz=u[k].z-local.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(d<R){var w=1-d/R,old=st.p[k];if(st.d[k]>.5){blocked=true;continue;}st.p[k]=Math.min(2,old+amt*w*(.4+.6*w)*(1-st.d[k]));ch=true;if(st.p[k]>1.02)ov=true;}}
 if(blocked&&!ch){var nw=performance.now();if(nw-lastWarn>1200){lastWarn=nw;toast('先に洗おう！ 汚れが残っていると磨けない');}}
 if(!ch)return;
 st._s=null;shapeStone(benchMesh,st);
 if(ov)snd.over();else snd.shine();
 var s=stats(st);
 if(!st.done&&s.avg>=.97&&s.over<.02){st.done=true;S.codex[st.t]=2;snd.perfect();burst(benchMesh.position,0xffffee,30,5);toast('完ぺき！ ピカピカになった');}
}

  if(ix>=0&&ix<PW&&iy>=0&&iy<PD&&iz>=0&&iz<PW&&grid[gi(ix,iy,iz)])return gi(ix,iy,iz);

  if(tmx<tmy&&tmx<tmz){t=tmx;tmx+=tdx;ix+=sx;}else if(tmy<tmz){t=tmy;tmy+=tdy;iy+=sy;}else{t=tmz;tmz+=tdz;iz+=sz;}

var P={x:0,y:0,z:8,vy:0,on:false,yaw:0,pitch:0};
function solidAt(x,y,z){
 if(y>=0)return false;
 var gx=Math.floor(x-X0),gz=Math.floor(z-Z0);
 if(gx<0||gx>=PW||gz<0||gz>=PW)return true;
 var d=Math.floor(-y);if(d>=PD)return true;
 return grid[gi(gx,d,gz)]!==0;}
var HS=[.05,.9,1.65],HW=.3;
function collides(x,y,z){
 for(var a=-1;a<=1;a+=2)for(var b=-1;b<=1;b+=2)for(var h=0;h<3;h++)if(solidAt(x+a*HW,y+HS[h],z+b*HW))return true;
 for(var i=0;i<COLS.length;i++){var c=COLS[i];if(y<c.h-.05&&x>c.x0-HW&&x<c.x1+HW&&z>c.z0-HW&&z<c.z1+HW)return true;}
 return false;}
function floorHit(x,y,z){return solidAt(x-HW,y-1e-4,z-HW)||solidAt(x+HW,y-1e-4,z-HW)||solidAt(x-HW,y-1e-4,z+HW)||solidAt(x+HW,y-1e-4,z+HW);}
var stepT=0,bob=0;
function stepPlayer(dt,mx,mz,jump,sprint){
 var sp=sprint?7.5:4.6,s=Math.sin(P.yaw),c=Math.cos(P.yaw);
 var wx=(mx*c+mz*s)*sp,wz=(-mx*s+mz*c)*sp; // mz: 前=-1
 var ox=P.x,oz=P.z;
 var nx=P.x+wx*dt;
 if(!collides(nx,P.y,P.z))P.x=nx;else if(P.on&&!collides(nx,P.y+1.05,P.z))P.vy=7;
 var nz=P.z+wz*dt;
 if(!collides(P.x,P.y,nz))P.z=nz;else if(P.on&&!collides(P.x,P.y+1.05,nz))P.vy=7;
 if(jump&&P.on){P.vy=7;P.on=false;}
 P.vy=Math.max(-30,P.vy-20*dt);
 var ny=P.y+P.vy*dt,wasOn=P.on;P.on=false;
 if(P.vy<=0){
  if(floorHit(P.x,ny,P.z)){P.y=Math.ceil(ny-1e-6);if(!wasOn&&P.vy<-8)snd.step();P.vy=0;P.on=true;}else P.y=ny;
 }else{
  if(collides(P.x,ny,P.z))P.vy=0;else P.y=ny;}
 if(P.y<-32){P.x=0;P.y=0;P.z=8;P.vy=0;}
 P.x=Math.max(-55,Math.min(55,P.x));P.z=Math.max(-55,Math.min(55,P.z));
 var moved=Math.hypot(P.x-ox,P.z-oz)/dt;
 if(P.on&&moved>1){bob+=dt*(sprint?13:9);stepT-=dt;if(stepT<=0){stepT=sprint?.3:.42;snd.step();}}
}

   infoEl.innerHTML='<b>'+STONES[st.t].n+'</b> '+kg(st)+'（平均の×'+ratio(st).toFixed(2)+'）<br>売値 '+fmt(value(st))+'G　汚れ '+Math.floor(s.dirt*100)+'%　ツヤ '+Math.floor(s.avg*100)+'%<div class="bar"><i style="width:'+(s.avg*100)+'%;background:linear-gradient(90deg,#6ad,#fff)"></i></div>磨きすぎ '+Math.floor(s.over*100)+'%'+(ov?' ⚠':'')+'<div class="bar"><i style="width:'+Math.min(100,s.over*300)+'%;background:#e5503a"></i></div><small>汚れは先に洗う。同じ所をこすり続けると石がやせます</small>';
  }else infoEl.style.display='none';
 }
 saveT+=dt;if(saveT>6){saveT=0;save();}
 renderer.render(scene,camera);
}

addEventListener('resize',resize);resize();

window.__g={P:P,S:S,grid:grid,oreT:oreT,STONES:STONES,hitBlock:hitBlock,polishAt:polishAt,openMenu:openMenu,earn:earn,qualifies:qualifies,stats:stats,value:value,genReq:genReq,randW:randW,syncBench:syncBench};
loop();
})();
