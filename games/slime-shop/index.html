<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html{touch-action:manipulation;-webkit-text-size-adjust:100%}input,select,textarea{font-size:max(16px,1em)}</style><script>(function(){var l=0,o={passive:false};document.addEventListener("touchstart",function(e){if(e.touches.length>1&&e.cancelable)e.preventDefault();},o);document.addEventListener("touchend",function(e){var n=Date.now();if(n-l<350&&e.cancelable)e.preventDefault();l=n;},o);["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();});});})();</script>
<meta name="theme-color" content="#2fae7a">
<title>スラバト商店</title>
<style>
  :root{--bg:#10241c;--panel:#fffaf0;--panel2:#f1ead8;--line:#e3d8bd;--text:#3b2a1c;--sub:#8a7a63;--accent:#2fae7a;--accent2:#ff8fb8;--ok:#2fae7a;--bad:#e5525a;--gold:#f0a824}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:var(--text);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button.main{background:linear-gradient(#5fe0a8,#2fae7a);color:#06301f;border-color:#a8f0cf;font-weight:bold}
  button.danger{background:#ffe3e3;border-color:#f0a0a0}
  input,select{font:inherit;color:var(--text);background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;user-select:text;-webkit-user-select:text}
  small,.sub{color:var(--sub);font-size:12.5px}
  h2{margin:0 0 8px;font-size:21px}h3{margin:14px 0 6px}
  .warn{color:var(--bad);font-weight:bold}

  #hud{position:fixed;top:8px;left:8px;right:104px;display:flex;gap:6px;flex-wrap:wrap;z-index:20;pointer-events:none}
  .chip{background:#fffaf0e8;border:2px solid var(--line);border-radius:20px;padding:3px 12px;font-size:14px;box-shadow:0 2px 6px #0003}
  .chip.money{color:#b87800;font-weight:bold;font-size:16px}
  .chip em{font-style:normal;font-size:12px;border-radius:8px;padding:0 6px;background:#ddd;margin-left:4px}.chip em.open{background:#bff0d4;color:#0a6a3a}
  #hud .warn{background:#fff;border:2px solid var(--bad);border-radius:20px;padding:3px 12px;font-size:14px}
  #btnHelp{position:fixed;top:8px;right:8px;z-index:21;width:40px;height:40px;border-radius:50%;padding:0;font-weight:bold}
  #prompt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000b;color:#fff;padding:10px 22px;border-radius:30px;font-size:18px;z-index:15;display:none;pointer-events:none;border:2px solid #ffe14a}
  #toasts{position:fixed;right:10px;top:56px;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:min(420px,60vw)}
  .toast{background:#fffaf0f2;border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:14px;box-shadow:0 3px 10px #0004;transition:opacity .4s;animation:pop .25s}
  .toast.good{border-color:#7fdcae}.toast.bad{border-color:#f0a0a0}
  @keyframes pop{from{transform:translateY(-8px) scale(.95);opacity:0}}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  #controls{position:fixed;left:10px;bottom:8px;font-size:12px;color:#fff;text-shadow:0 1px 4px #000;z-index:10;pointer-events:none}

  /* 工房 */
  #ws{position:fixed;inset:0;display:none;pointer-events:none;z-index:12;flex-direction:column;justify-content:flex-end}
  #ws>*{pointer-events:auto}
  #wsItems{position:fixed;left:8px;top:52px;max-height:calc(100vh - 150px);width:210px;overflow:auto;background:#fffaf0ec;border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #wsRead{position:fixed;right:8px;top:52px;max-height:calc(100vh - 150px);width:270px;overflow:auto;background:#fffaf0ec;border:2px solid var(--line);border-radius:16px;padding:10px}
  .ing{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;touch-action:none;user-select:none}
  .ing.on{background:#bff0d4;border-color:var(--accent);transform:scale(.98)}
  .ing .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;border:1px solid #0002;flex:none}
  .ing .nm{flex:1;font-size:13.5px;line-height:1.2}
  .ing small{font-size:11px;white-space:nowrap}
  #wsBottom{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:10px;align-items:center;background:#fffaf0ec;border:2px solid var(--line);border-radius:18px;padding:8px 14px}
  #wsStir{display:flex;align-items:center;gap:8px;min-width:250px}#wsStir .bar{flex:1;min-width:90px}
  .bar{height:12px;background:#e6dcc4;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;background:var(--accent)}
  .bar.sm{height:7px;margin:2px 0 4px}
  .rd{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0;flex-wrap:wrap}.rd .bar{width:100%}
  .rd-h{display:flex;justify-content:space-between;margin:8px 0 3px;font-size:14px}
  .gauge{position:relative;height:14px;border-radius:8px;border:1px solid #0003;margin:2px 0 8px}
  .gauge i{position:absolute;top:-4px;width:4px;height:22px;background:#222;border-radius:2px;transform:translateX(-2px)}

  /* モーダル */
  #modal{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:center;justify-content:center;padding:14px;max-height:100dvh}
  .win{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:16px 18px;width:min(560px,100%);max-height:94vh;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 10px 40px #0008;user-select:text;-webkit-user-select:text}
  .win.wide{width:min(760px,100%)}
  .win .scroll{overflow:auto;margin-top:8px;padding-right:4px;min-height:0;flex:0 1 auto}
  .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row.between{justify-content:space-between}.row.end{justify-content:flex-end;margin-top:12px}
  .grow{flex:1;min-width:0}
  .card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
  .item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0}
  .item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;border:1px solid #0002;flex:none;background:var(--panel2)}
  .price{color:#b87800;white-space:nowrap}
  .tag{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;background:var(--panel2);border:1px solid var(--line);margin:1px 3px 1px 0}
  .tag.sale{background:#ffe3e3;border-color:#f0a0a0;color:#b02a32}
  .t-ft{background:#f1e6ff}
  .t-nettori{background:#e5f3ff}.t-danryoku{background:#ffe9e9}.t-torotoro{background:#e8f9ee}.t-fuwafuwa{background:#fff2d9}
  .sw{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid #0002;vertical-align:middle;font-size:12px}.sw.big{width:64px;height:64px;font-size:26px;flex:none}
  .rank{display:inline-block;min-width:22px;text-align:center;border-radius:8px;font-weight:bold;padding:0 5px;color:#fff}
  .rankC{background:#9aa}.rankB{background:#5aa0e0}.rankA{background:#f0a824}.rankS{background:linear-gradient(135deg,#ff6ab5,#ffb347)}
  .tbl{width:100%;border-collapse:collapse}.tbl td{padding:4px 2px;border-bottom:1px dashed var(--line)}.tbl td:last-child{text-align:right;white-space:nowrap}
  .tbl .g{color:var(--ok);font-weight:bold}.tbl .r{color:var(--bad)}.tbl .tot td{font-weight:bold;font-size:18px;border:none}
  .tabs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.tabs button{padding:5px 12px;border-radius:10px 10px 0 0}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slot{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin:6px 0;flex-wrap:wrap}
  .slot .no{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
  .slot select{max-width:210px}
  .pc{display:flex;align-items:center;gap:4px}.pc button{padding:4px 7px;font-size:13px}.pv{min-width:70px;text-align:center;color:#b87800}
  .rescard{display:flex;gap:14px;align-items:center;margin:8px 0}.rescard input{width:100%;font-size:18px;font-weight:bold}
  .ab{max-height:220px;overflow:auto;margin-top:6px}.abrow{display:flex;align-items:center;gap:8px;padding:2px 0}.abrow span{flex:1;font-size:13px}.abrow b{min-width:70px;text-align:center}.abrow button{padding:1px 10px}
  .combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .cb{border:2px dashed var(--line);border-radius:12px;padding:8px;text-align:center;color:var(--sub)}.cb.got{border-style:solid;border-color:#7fdcae;background:#effcf5;color:var(--text)}.cb small{display:block}
  ol{margin:6px 0;padding-left:20px;line-height:1.7}

  button.mini{padding:1px 8px;font-size:12px;border-radius:9px;margin-left:4px}
  html{overscroll-behavior:none;touch-action:manipulation}
  /* さわるモード */
  #wsTouch{position:fixed;inset:0;display:none;z-index:12;pointer-events:none;flex-direction:column;justify-content:space-between;align-items:center;padding:56px 10px 14px}
  #wsTouch>*{pointer-events:auto}
  #wsTouch .tcard{background:#fffaf0ec;border:2px solid var(--line);border-radius:16px;padding:8px 14px;text-align:center;max-width:min(520px,94vw);line-height:1.6}
  #wsTouch .tn{font-size:18px}#wsTouch #wsTouchExit{font-size:18px;padding:10px 30px;border-radius:30px}
  #wsTouch .tbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  #wsTouch .tbar button.on,#wsBottom button.on{background:#2b3358;color:#fff;border-color:#8fa0ff}
  body.touch #wsTwo{display:none}
  /* スマホ・タッチ操作 */
  #touchUI{display:none}
  body.touch #touchUI{display:block}
  body.touch.in-ws #touchUI,body.touch.in-ui #touchUI{display:none}
  body.touch #prompt,body.touch #controls{display:none!important}
  #joy{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#ffffff55;border:3px solid #ffffffaa;z-index:25;touch-action:none;display:grid;place-items:center;backdrop-filter:blur(2px)}
  #joy i{width:56px;height:56px;border-radius:50%;background:#fffffff0;box-shadow:0 3px 10px #0005}
  #btnRun{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(152px,calc(env(safe-area-inset-bottom) + 128px));z-index:25;border-radius:30px;padding:10px 16px;font-size:14px;opacity:.9;touch-action:none}
  #btnRun.on{background:#bff0d4;border-color:var(--accent)}
  #btnAct{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(40px,calc(env(safe-area-inset-bottom) + 16px));z-index:25;display:none;border-radius:34px;padding:16px 20px;font-size:16px;font-weight:bold;max-width:60vw;background:linear-gradient(#ffe36a,#f0b824);border-color:#fff1a8;touch-action:none;box-shadow:0 6px 16px #0006}
  @media (max-width:820px),(pointer:coarse){
    .chip{font-size:12px;padding:2px 9px}.chip.money{font-size:14px}
    #hud{gap:4px;right:100px}
    #wsItems{left:0;right:0;top:auto;bottom:108px;width:auto;max-height:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-radius:16px 16px 0 0;padding:6px;gap:6px}
    .ing{flex:none;min-width:128px;padding:5px 7px;touch-action:pan-x}.ing .nm{font-size:12px}
    #wsRead{left:6px;right:6px;top:42px;width:auto;max-height:38vh;padding:8px 10px}
    #wsRead.mini{max-height:96px;overflow:hidden;position:fixed}
    #wsRead.mini:after{content:"▼ タップでひらく";display:block;text-align:center;font-size:11px;color:var(--sub)}
    #wsBottom{left:6px;right:6px;bottom:6px;transform:none;justify-content:space-between;padding:6px 8px;gap:6px}
    #wsStir{min-width:0;flex:1}#wsStir small{display:none}#wsStir span{white-space:nowrap;font-size:12px}
    #wsBottom{flex-wrap:wrap;justify-content:center}
    #wsStir{flex:1 1 100%}
    #wsBottom button{flex:1 1 auto}
    body.in-ws #hud .chip:nth-child(n+3){display:none}
    body.in-adv #hud .chip:nth-child(n+4),body.in-adv #hud .warn{display:none}
    #advHUD{top:52px}
    #wsBottom button{padding:8px 10px;font-size:14px}
    .win{padding:12px 13px;border-radius:16px}
    .item{flex-wrap:wrap;gap:6px}.item .price{margin-left:auto}
    .slot select{max-width:100%;flex:1 1 140px}
    .toast{font-size:13px}#toasts{top:44px;max-width:72vw}
    #title button{min-width:200px;font-size:18px}
    .tabs button{padding:5px 9px;font-size:13px}
  }
  #ask{position:fixed;inset:0;z-index:90;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}
  #ask .win{width:min(420px,100%)}#ask .askmsg{font-size:16px;line-height:1.7;margin:4px 0 8px}
  #btnSns{position:fixed;top:8px;right:54px;z-index:21;width:40px;height:40px;border-radius:50%;padding:0;font-size:20px}
  .prof{display:flex;align-items:center;gap:14px;margin:6px 0}.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#ff8fb8,#ffd23f,#62d6a8);display:grid;place-items:center;font-size:30px;border:3px solid #fff;box-shadow:0 0 0 2px #e3d8bd}
  .pstats{display:flex;gap:18px;flex:1;justify-content:space-around;text-align:center}.pstats b{display:block;font-size:18px}.pstats small{color:var(--sub)}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.stile{position:relative;aspect-ratio:1;cursor:pointer;overflow:hidden;border-radius:6px;background:#eee}.stile img{width:100%;height:100%;object-fit:cover;display:block}
  .stile .lk{position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;border-radius:10px;padding:0 7px;font-size:12px}.stile .vr{position:absolute;right:4px;top:2px}.stile .pg{position:absolute;right:6px;bottom:4px;color:#fff;text-shadow:0 1px 3px #000}
  .comp{display:flex;gap:12px;align-items:flex-start;margin:8px 0}.cimg{width:130px;height:130px;border-radius:12px;object-fit:cover;border:2px solid var(--line)}.bigimg{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:#eee}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chips .mini.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ug{display:flex;gap:8px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin:5px 0}.ug.g{border-color:#7fdcae}.ic2{font-size:24px}
  @media (max-width:820px),(pointer:coarse){#btnSns{right:50px}.comp{flex-direction:column}.cimg{width:100%;height:auto;aspect-ratio:1}}
  .chip.surge{background:#ffe9b0;border-color:#f0a824;font-weight:bold;animation:sg 1s infinite alternate}@keyframes sg{to{transform:scale(1.06)}}
  #btnSns[data-n]:not([data-n="0"]):after{content:attr(data-n);position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5525a;color:#fff;font-size:11px;line-height:18px;text-align:center}
  /* 冒険 */
  #advHUD{position:fixed;left:50%;top:50px;transform:translateX(-50%);z-index:18;display:none;text-align:center;pointer-events:none}
  #advHP{position:relative;width:min(360px,70vw);height:22px;background:#2a1a1a;border:2px solid #fff;border-radius:12px;overflow:hidden;margin:0 auto}
  #advHP i{display:block;height:100%;background:linear-gradient(#ff8a8a,#e5525a);width:100%}
  #advHP span{position:absolute;inset:0;font-size:13px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000;line-height:20px}
  #advInfo{margin-top:4px;font-size:13px;color:#fff;text-shadow:0 1px 4px #000;font-weight:bold}
  #advBoss{position:fixed;left:50%;top:104px;transform:translateX(-50%);z-index:18;display:none;width:min(420px,80vw);text-align:center;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
  #advBoss .bar{height:14px;background:#2a2a1a;border-color:#fff}#advBoss .bar i{background:linear-gradient(#ffe36a,#f0a824)}
  #btnAtk{display:none;position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(150px,calc(env(safe-area-inset-bottom) + 130px));width:86px;height:86px;border-radius:50%;font-size:38px;padding:0;background:linear-gradient(#ff8a8a,#e5525a);border-color:#fff;z-index:26;touch-action:none;box-shadow:0 6px 16px #0007}
  body.touch.in-adv #btnAtk{display:block}
  body.touch.in-adv #btnRun{bottom:max(244px,calc(env(safe-area-inset-bottom) + 226px))}
  body.touch.in-ui #btnAtk,body.touch.in-ws #btnAtk{display:none}
  body.hurt:after{content:"";position:fixed;inset:0;box-shadow:inset 0 0 110px 36px #ff2a2aaa;z-index:35;pointer-events:none}
  /* タイトル */
  #title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse 42% 58% at 50% 52%,rgba(6,66,44,.62) 0,rgba(6,66,44,.34) 55%,rgba(6,66,44,0) 100%);text-align:center;backdrop-filter:saturate(1.1)}
  #title h1{margin:0;font-size:clamp(34px,7vw,64px);color:#fff;text-shadow:0 4px 0 #1c7a53,0 8px 20px #0004;letter-spacing:2px}
  #title .blob{width:96px;height:70px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 35% 30%,#fff9,#7be8b2 50%,#3fc088);box-shadow:inset -8px -10px 20px #0002,0 14px 24px #0003;position:relative;animation:wob 2s infinite ease-in-out}
  #title .blob:before,#title .blob:after{content:"";position:absolute;top:26px;width:11px;height:14px;border-radius:50%;background:#103020}
  #title .blob:before{left:27px}#title .blob:after{right:27px}
  @keyframes wob{50%{transform:scale(1.08,.92)}}
  #title button{font-size:20px;padding:12px 40px;min-width:240px}
  #title p{color:#fff;margin:0;max-width:520px;padding:6px 14px;text-shadow:0 2px 8px #063a26,0 0 3px #063a26;font-weight:bold}
  #title button{box-shadow:0 6px 18px #0005;border-radius:30px}
  .feel{background:#effcf5;border:2px solid #7fdcae;border-radius:12px;padding:6px 10px;margin-bottom:8px;font-size:14px;line-height:1.6}
  body.thumb #title button,body.thumb #title p,body.thumb #controls,body.thumb #btnHelp{display:none}
  body.thumb #title{justify-content:flex-end;padding-bottom:5vh;background:linear-gradient(to top,rgba(6,66,44,.62) 0,rgba(6,66,44,.28) 18%,rgba(6,66,44,0) 34%)}
  body.thumb #title .blob{display:none}
  body.thumb #title h1{font-size:clamp(40px,9vw,92px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<button id="btnHelp" title="あそびかた">?</button>
<button id="btnSns" title="スラグラム">📱</button>
<div id="prompt"></div>
<div id="toasts"></div>
<div id="controls">WASD:歩く　ドラッグ:視点　ホイール:ズーム　Shift:ダッシュ　E:調べる　山の中 Space/F:こうげき</div>
<div id="fade"></div>

<div id="ws">
  <div id="wsItems"></div>
  <div id="wsRead"></div>
  <div id="wsBottom">
    <div id="wsStir"></div>
    <button class="main" id="wsFinish">✅ 完成！</button>
    <button class="danger" id="wsDump">🗑 すてる</button>
    <button id="wsDark">🌙 暗くする</button>
    <button id="wsExit">もどる</button>
  </div>
</div>

<div id="touchUI">
  <div id="joy"><i></i></div>
  <button id="btnRun">ダッシュ</button>
  <button id="btnAct"></button>
</div>
<div id="wsTouch">
  <div class="tcard"><b class="tn"></b><div class="tl"></div></div>
