<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html{touch-action:manipulation}</style><script>(function(){var l=0;document.addEventListener("touchend",function(e){var n=Date.now();if(n-l<350&&e.cancelable)e.preventDefault();l=n;},{passive:false});["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();});});})();</script>
<meta name="theme-color" content="#14182b">
<title>ソダテバトル</title>
<style>
  :root{--bg:#14182b;--panel:#1f2540;--panel2:#2a3156;--line:#3b4478;--text:#eef1ff;--sub:#9aa3d6;--accent:#ffcf4a;--ok:#5fd16b;--bad:#ff6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{overflow:auto}
  #ui{max-width:980px;margin:0 auto;padding:12px 14px 40px}
  h1,h2,h3{margin:0}
  button{font:inherit;color:var(--text);background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button.main{background:linear-gradient(#ffd95e,#f0a824);color:#2a1a00;border-color:#ffe9a0;font-weight:bold}
  button.danger{background:#5a2433;border-color:#a04058}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .sub{color:var(--sub);font-size:13px}
  .tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;background:var(--panel2);border:1px solid var(--line);margin-right:4px}
  .center{text-align:center}
  .bar{height:12px;background:#0f1226;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%}
  .statrow{display:grid;grid-template-columns:62px 40px 1fr;gap:6px;align-items:center;margin:3px 0;font-size:14px}
  .top{padding-right:46px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .day{font-size:22px;font-weight:bold}
  .day small{font-size:14px;color:var(--sub);font-weight:normal}
  .tp{color:var(--accent);font-weight:bold}
  .warn{color:var(--bad);font-weight:bold}
  .pips span{display:inline-block;width:18px;height:18px;border-radius:50%;background:#0f1226;border:2px solid var(--line);margin-right:4px}
  .pips span.on{background:var(--accent);border-color:#fff3b8}
  .tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px}
  .tbtn b{font-size:16px}
  .toast{background:#273066;border:2px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:10px;white-space:pre-line}
  .title{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .title h1{font-size:clamp(34px,8vw,60px);letter-spacing:.06em;color:var(--accent);text-shadow:0 4px 0 #7a4a00,0 0 30px #ff9a2a88}
  .title button{min-width:240px;font-size:18px}
  .big{font-size:48px}
  .vs{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
  .win{color:var(--accent);font-size:40px;font-weight:bold}
  .lose{color:var(--bad);font-size:40px;font-weight:bold}
  .skill{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .slot{border:2px dashed var(--line);border-radius:10px;padding:8px;min-height:56px;font-size:14px;text-align:center}
  .slot.on{border-style:solid;border-color:var(--accent);background:var(--panel2)}
  canvas.radar{width:100%;max-width:260px;aspect-ratio:1;display:block;margin:0 auto}
  .hidden{display:none!important}

  .bt-bar{position:relative;height:18px;background:#000b;border:2px solid #fff;border-radius:9px;overflow:hidden;margin-top:2px;box-shadow:0 0 8px #0008}
  .bt-bar i{position:absolute;left:0;top:0;bottom:0;display:block}
  .bt-bar .hp{background:linear-gradient(#a8ffbd,#2fbf55 55%,#1f9a40);transition:width .1s}
  .bt-bar .ghost{background:#fff;opacity:.85;transition:width .7s .35s}
  .bt-side.r .bt-bar i{left:auto;right:0}
  .bt-side.r .bt-bar .hp{background:linear-gradient(#ffc0a8,#e0502f 55%,#a82a18)}
  .bt-gauge{position:relative;height:10px;background:#000a;border:1px solid #fff;border-radius:6px;overflow:hidden;margin-top:4px}
  .bt-gauge i{display:block;height:100%;background:linear-gradient(#ffe27a,#ff9a2a);width:0;transition:width .15s}
  .bt-gauge span{position:absolute;right:4px;top:-2px;font-size:8px;opacity:.8}
  .bt-gauge.full{animation:gfull .5s infinite alternate;border-color:#ffe27a}
  @keyframes gfull{to{box-shadow:0 0 12px #ffcf4a}}
  #bt-time{font-size:36px;min-width:64px;text-align:center;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill}
  #bt-time.low{color:#ff6b6b}
  #bt-msg{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:clamp(44px,11vw,100px);font-style:italic;color:#ffe27a;opacity:0;-webkit-text-stroke:3px #5a2a00;paint-order:stroke fill;text-shadow:0 6px 0 #7a4a00,0 0 40px #ff9a2a}
  #bt-msg.pop{animation:msgpop .5s ease-out}
  @keyframes msgpop{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.95)}100%{transform:scale(1)}}
  .dmg{position:absolute;font-size:28px;transform:translate(-50%,-50%);animation:rise .95s ease-out forwards;-webkit-text-stroke:3px #000;paint-order:stroke fill;white-space:nowrap;font-weight:900}
  .dmg.big{font-size:40px}
  .dmg.crit{font-size:50px;font-style:italic}
  .dmg.sm{font-size:20px}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-70%) scale(1.45)}25%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
  #bt-vig{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,#d01010cc 100%)}
  #bt-flash{position:absolute;inset:0;background:#fff;opacity:0}
  #bt-combo{position:absolute;right:5%;top:30%;font-size:44px;font-style:italic;color:#ffe27a;opacity:0;-webkit-text-stroke:2px #5a2a00;paint-order:stroke fill;text-shadow:0 4px 0 #7a4a00}
  #bt-combo.pop{animation:combo .25s ease-out}
  @keyframes combo{0%{transform:scale(1.8)}100%{transform:scale(1)}}
  #bt-intro{position:absolute;left:0;right:0;bottom:14%;text-align:center;opacity:0;transition:opacity .5s}
  #bt-intro-r{font-size:16px;color:#ffcf4a;letter-spacing:.3em}
  #bt-intro-n{font-size:clamp(28px,6vw,52px);font-style:italic;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000}
  #bt-intro-s{font-size:16px;color:#dfe6ff}
  #bt-cut{position:absolute;left:0;right:0;top:34%;height:130px;overflow:hidden;pointer-events:none;opacity:0}
  #bt-cut .band{position:absolute;inset:20px -10% 20px -10%;background:linear-gradient(100deg,#0008,#ff9a2acc 30%,#ffe27add 60%,#0008);transform:skewX(-14deg);display:flex;align-items:center;justify-content:center;gap:24px;box-shadow:0 0 40px #ff9a2a}
  #bt-cut .band span{font-size:22px;transform:skewX(14deg);color:#fff;-webkit-text-stroke:1px #000;paint-order:stroke fill}
  #bt-cut .band b{font-size:clamp(30px,7vw,54px);font-style:italic;transform:skewX(14deg);color:#fff;-webkit-text-stroke:3px #7a2a00;paint-order:stroke fill;text-shadow:0 4px 0 #7a2a00}
  #bt-cut.show{animation:cut 1s ease-out}
  @keyframes cut{0%{opacity:0;transform:translateX(-60%)}15%{opacity:1;transform:translateX(0)}80%{opacity:1;transform:translateX(3%)}100%{opacity:0;transform:translateX(30%)}}
  .bt-btn.rdy{border-color:#ffe27a}
  .bt-btn.down{transform:scale(.92);filter:brightness(1.4)}
  .bt-help{position:absolute;left:10px;bottom:6px;font-size:11px;opacity:.6}
  #mute{position:fixed;right:8px;top:8px;z-index:60;padding:4px 8px;border-radius:20px;font-size:16px;opacity:.8}
  #ui{animation:fadein .35s ease-out}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  body{background:radial-gradient(ellipse at 50% -10%,#2b3570 0%,#14182b 60%) fixed}
  .card{background:linear-gradient(160deg,#252c52,#1b2040);box-shadow:0 4px 18px #0006,inset 0 1px 0 #ffffff14}
  button.main{box-shadow:0 3px 0 #a86a00,0 6px 14px #0006}
  button.main:active{transform:translateY(2px)}
  .pv{position:relative;height:260px;border-radius:12px;margin:6px 0;background:radial-gradient(ellipse at 50% 85%,#3b4a9a 0%,#1b2040 70%);overflow:hidden}
  .pv canvas{width:100%;height:100%;display:block}
  .gainpop{position:fixed;font-weight:900;font-size:24px;color:#ffe27a;-webkit-text-stroke:3px #000;paint-order:stroke fill;pointer-events:none;animation:rise 1.1s ease-out forwards;z-index:70}

  /* バトル */
  #battle{position:fixed;inset:0;z-index:50;background:#000;touch-action:none}
  #bt-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bt-hud{position:absolute;inset:0;pointer-events:none;font-weight:bold;text-shadow:0 2px 4px #000}
  .bt-top{position:absolute;top:10px;left:10px;right:54px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .bt-side{flex:1;max-width:42%}
  .bt-side.r{text-align:right}
  .bt-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bt-num{font-size:12px;opacity:.9}
  #bt-fx{position:absolute;inset:0;overflow:hidden}
  .bt-btns{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,64px);gap:8px;pointer-events:auto}
  .bt-btn{position:relative;overflow:hidden;width:64px;height:64px;border-radius:14px;border:3px solid #fff;background:#223;color:#fff;font-size:11px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;touch-action:none}
  .bt-btn b{font-size:14px}
  .bt-btn .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:#000b}
  .bt-btn.atk{grid-column:span 2;grid-row:span 2;width:136px;height:136px;border-radius:50%;background:#b83a2a;font-size:20px}
  .bt-btn.step{background:#2a6ab0}
  .bt-btn.guard{background:#3a8a5a}
  .bt-btn.ult{background:#555;opacity:.55}
  .bt-btn.ult.ready{background:linear-gradient(#ffd95e,#e06a1a);opacity:1;animation:pulse .6s infinite alternate;color:#300}
  @keyframes pulse{to{transform:scale(1.08)}}
  #bt-stick{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:#ffffff22;border:3px solid #fff8;pointer-events:auto;touch-action:none}
  #bt-knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fffc}
  #bt-quit{position:absolute;left:10px;top:78px;pointer-events:auto;font-size:12px;padding:4px 8px;opacity:.7}
  .keyhint{font-size:10px;opacity:.7}
  @media (max-width:760px){
    .bt-btns{grid-template-columns:repeat(4,52px);gap:6px}
    .bt-btn{width:52px;height:52px;font-size:9px}
    .bt-btn.atk{width:110px;height:110px}
    #bt-stick{width:120px;height:120px}
  }
  @media (hover:hover) and (pointer:fine){ #bt-stick{display:none} }

  /* ---- スマホ対応 ---- */
  body.in-battle{overflow:hidden}
  html{-webkit-text-size-adjust:100%}
  #ui{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:max(40px,env(safe-area-inset-bottom))}
  @media (pointer:coarse){
    .keyhint,.bt-help{display:none}
    #bt-quit{padding:8px 12px;font-size:13px}
    button{min-height:40px}
  }
  @media (max-width:760px){
    .homegrid>div:nth-child(2){order:-1}
    .pv{height:210px}
    canvas.radar{max-width:210px}
    .title button{min-width:200px}
    .day{font-size:19px}
  }
  /* 横向きのスマホ */
  @media (max-height:500px) and (orientation:landscape){
    .bt-btns{grid-template-columns:repeat(4,50px);gap:5px}
    .bt-btn{width:50px;height:50px;font-size:9px}
    .bt-btn.atk{width:105px;height:105px}
    .bt-btn.ult{width:auto;height:30px;flex-direction:row;gap:6px;font-size:10px;padding:0}
    .bt-btn.ult b{font-size:11px}
    #bt-stick{width:112px;height:112px}
    .bt-top{top:6px}
    #bt-time{font-size:28px;min-width:50px}
    .bt-name{font-size:12px}
    .bt-bar{height:13px}
    .bt-num{display:none}
    #bt-quit{top:56px}
    #bt-msg{top:22%}
  }
  /* 縦向きのスマホ */
  @media (max-width:520px) and (orientation:portrait){
    .bt-btns{grid-template-columns:repeat(3,58px);grid-auto-rows:58px;gap:6px}
    .bt-btns .bt-btn{width:58px;height:58px;font-size:10px}
    .bt-btns .bt-btn:nth-child(1){grid-column:1;grid-row:1}
    .bt-btns .bt-btn:nth-child(2){grid-column:2;grid-row:1}
    .bt-btns .bt-btn:nth-child(3){grid-column:3;grid-row:1}
    .bt-btns .bt-btn:nth-child(4){grid-column:1;grid-row:2}
    .bt-btns .bt-btn:nth-child(6){grid-column:2;grid-row:2}
    .bt-btns .bt-btn:nth-child(7){grid-column:3;grid-row:2}
    .bt-btns .bt-btn.atk{grid-column:1 / 4;grid-row:3;width:auto;height:66px;border-radius:33px;font-size:18px}
    .bt-btns .bt-btn.ult{grid-column:1 / 4;grid-row:4;width:auto;height:44px;font-size:12px;flex-direction:row;gap:8px}
    #bt-stick{width:124px;height:124px;bottom:calc(30px + env(safe-area-inset-bottom))}
    .bt-num{display:none}
  }
</style>
</head>
<body>
<div id="ui"></div>

<div id="battle" class="hidden">
  <canvas id="bt-canvas"></canvas>
  <div id="bt-fx"></div>
  <div id="bt-hud">
    <div id="bt-vig"></div>
    <div id="bt-flash"></div>
    <div class="bt-top">
      <div class="bt-side">
        <div class="bt-name"><span id="bt-pe"></span> <span id="bt-pn"></span></div>
        <div class="bt-bar"><i id="bt-pghost" class="ghost"></i><i id="bt-php" class="hp" style="width:100%"></i></div>
        <div class="bt-num" id="bt-pnum"></div>
        <div class="bt-gauge"><i id="bt-gauge"></i><span>ULT</span></div>
      </div>
      <div id="bt-time">90</div>
      <div class="bt-side r">
        <div class="bt-name"><span id="bt-ee"></span> <span id="bt-en"></span></div>
        <div class="bt-bar"><i id="bt-eghost" class="ghost"></i><i id="bt-ehp" class="hp" style="width:100%"></i></div>
        <div class="bt-num" id="bt-enum"></div>
      </div>
    </div>
    <button id="bt-quit">あきらめる</button>
    <div id="bt-combo"></div>
    <div id="bt-intro"><div id="bt-intro-r"></div><div id="bt-intro-n"></div><div id="bt-intro-s"></div></div>
    <div id="bt-cut"><div class="band"><span id="bt-cut-n"></span><b id="bt-cut-s"></b></div></div>
    <div id="bt-msg"></div>
    <div id="bt-stick"><div id="bt-knob"></div></div>
    <div class="bt-btns">
      <button class="bt-btn" id="bt-s0" data-k="KeyS"><i class="cd"></i><b>S</b><span class="nm"></span></button>
      <button class="bt-btn" id="bt-s1" data-k="KeyD"><i class="cd"></i><b>D</b><span class="nm"></span></button>
      <button class="bt-btn" id="bt-s2" data-k="KeyW"><i class="cd"></i><b>W</b><span class="nm"></span></button>
      <button class="bt-btn" id="bt-s3" data-k="KeyE"><i class="cd"></i><b>E</b><span class="nm"></span></button>
      <button class="bt-btn atk" data-k="KeyA"><b>攻撃</b><span class="keyhint">A（長押しで溜め）</span></button>
      <button class="bt-btn step" data-k="Space"><b>回避</b><span class="keyhint">Space</span></button>
      <button class="bt-btn guard" data-k="ShiftLeft"><b>ガード</b><span class="keyhint">Shift</span></button>
      <button class="bt-btn ult" id="bt-ult" data-k="KeyQ" style="grid-column:span 4"><b>必殺 (Q)</b><span class="nm"></span></button>
    </div>
    <div class="bt-help">移動：矢印キー</div>
  </div>
</div>
<button id="mute" title="音のON/OFF">🔊</button>

<script id="noctx">addEventListener('contextmenu', function (e) { e.preventDefault(); });</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js?v=b9f859c5"></script>
<script src="js/audio.js?v=b9f859c5"></script>
<script src="js/fx.js?v=b9f859c5"></script>
<script src="js/battle.js?v=b9f859c5"></script>
<script src="js/preview.js?v=b9f859c5"></script>
<script src="js/game.js?v=b9f859c5"></script>
</body>
</html>
